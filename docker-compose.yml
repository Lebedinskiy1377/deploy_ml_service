name: dynamic-pricing

# Every variable has a local-demo default, so `docker compose up` works without
# a .env file. Copy .env.example to .env to override them.
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-pricing}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricing}
  POSTGRES_DB: ${POSTGRES_DB:-pricing}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *postgres-env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2022-05-08T23-50-31Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mlflow:
    build: ./infra/mlflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-pricing}:${POSTGRES_PASSWORD:-pricing}@db:5432/mlflow
      # Artifacts are proxied by the server, so only MLflow needs S3 credentials.
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MLFLOW_ARTIFACT_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./sku_price_model_service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend_ml
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      FASTAPI_BASE_URL: http://api:8005
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off jobs: docker compose run --rm seed | trainer
  seed:
    build: ./sku_price_model_service
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["python", "/scripts/seed_demo_db.py", "--data-path", "/data/sku_sales.csv"]
    volumes:
      - ./scripts:/scripts:ro
      - ./application/data/processed:/data:ro

  trainer:
    build: ./application
    profiles: [tools]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: dynamic-pricing-demand

volumes:
  pgdata:
  minio-data:
